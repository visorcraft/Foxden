# CI build: lint + assemble the extension on every push/PR.
# Tag-triggered releases are handled in release.yml.

name: build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Lint + build extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install -g web-ext

      - name: Validate manifest.json
        run: python3 -m json.tool < manifest.json > /dev/null

      - name: Lint extension with web-ext
        run: web-ext lint --source-dir . --ignore-files "scripts/**" "tests/**" "assets/screenshots/**" "docs/**" "*.md" "*.xpi"

      - name: Build extension package
        run: |
          zip -r Foxden-extension.xpi backend/ assets/icons/ popup/ manifest.json
          echo "Built extension package:"
          ls -la Foxden-extension.xpi
          unzip -l Foxden-extension.xpi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: Foxden-extension.xpi
          retention-days: 30
